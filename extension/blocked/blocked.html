<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily limit reached · SyncOn</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="card">
    <div id="blockIcon" class="lock">⌛</div>
    <h1 id="title">Daily limit reached</h1>
    <p id="message" class="muted"></p>
    <div class="usage"><span>Used today</span><strong id="usage"></strong></div>
    <p id="tagline" class="tagline">“Take a break. You’ll be back stronger.”</p>
    <div id="actions" class="actions"></div>
    <small class="muted">Your Chrome usage day resets at 4:00 AM.</small>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
