<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncOn</title>
  <link rel="stylesheet" href="../shared.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="pairingRequired" class="pairing-required" hidden>
    <div class="brand"><img class="mark" src="../assets/icon-32.png" alt=""><span>SyncOn</span></div>
    <section class="card pairing-prompt">
      <div class="eyebrow">Android connection required</div>
      <h1>Scan once to activate</h1>
      <p class="muted">Open the pairing code, then scan it from SyncOn on your Android phone.</p>
      <button id="connectPhone" class="pill">Show pairing QR</button>
    </section>
  </main>
  <main id="extensionApp">
    <header class="row between">
      <div class="brand"><img class="mark" src="../assets/icon-32.png" alt=""><span>SyncOn</span></div>
      <span id="status" class="row muted"><i class="status-dot"></i><span>Tracking</span></span>
    </header>

    <section class="hero card">
      <div class="eyebrow">Chrome today</div>
      <div id="total" class="metric">0m</div>
      <div id="current" class="muted">Waiting for an active website</div>
    </section>

    <div id="scopeToggle" class="scope-toggle" hidden>
      <button data-scope="ALL" class="active">All</button>
      <button data-scope="CHROME">Chrome</button>
    </div>

    <button id="connection" class="connection card" type="button">
      <span><strong>Android sync</strong><small id="connectionDetail" class="muted">Checking connection…</small></span>
      <span aria-hidden="true">→</span>
    </button>

    <section>
      <div class="row between section-title"><strong>Top websites</strong><span id="dayLabel" class="muted"></span></div>
      <div id="domains" class="domain-list card"></div>
    </section>

    <footer class="row">
      <button id="toggle" class="pill secondary">Pause tracking</button>
      <button id="dashboard" class="pill">Open dashboard</button>
    </footer>
  </main>
  <script src="../lib/core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
